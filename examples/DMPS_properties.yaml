# The MPSS configuration file. Can store multiple configurations.

UEF-A20:     # configuration name

  # DMA properties
  Qsh: 5      # sheath flow rate [L/min]
  Qe: 5       # exhaust flow rate [L/min]
  Qa: 1       # aerosol flow rate [L/min]
  Qc: 1       # classified sample flow rate [L/min]
  R1: 0.025   # inner radius of the DMA [m]
  R2: 0.033   # outer radius of the DMA [m]
  L: 0.28     # length of the DMA [m]
  L_eff: 4.6  # effective DMA length [m], used in calculating losses
  center_voltage_sign: positive  # polarity of center electrode
  
  # CPC properties
  CPC_Qsample: 1           # CPC sample flow rate [L/min]
  CPC_measuring_time: 5    # measurement time per one output channel [s]
  CPC_output_type: counts  # output type (counts/concentration)
  # coefficients for using the ACTRIS type counting efficiency equation:
  # a * (1 - exp(log(2) * ((b - d_p) / (dp50 - b))))
  CPC_a: 0.96      # plateau efficiency [0 - 1]
  CPC_b: 6.86      # diameter where the curve intersects the diameter-axis [nm]
  CPC_dp50: 10.08  # 50 % counting efficiency diameter [nm]
  
  # Inlet line losses
  # The sampling line can be composed of any number of sections.
  # Each row below describes one section. For no inlet remove/comment out all rows.
  inlets:
    # [length [m], flow rate [l/min]]
    - [2.5, 55.0]
    - [1.0, 4.0]
    - [1.05, 2.0]
    - [0.60, 1.0]
